name: CI/CD

on: push

env:
  PROJECT_NAME: realtime-parking-bz-shim
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}/${{ github.event.repository.name }}
  DOCKER_TAG: ${{ github.sha }}
  KUBERNETES_NAMESPACE: parking
  K8S_NAME: realtime-parking-bz-shim
  VALUES_YAML_TEST: infrastructure/helm/values.testing.yaml
  VALUES_YAML_PROD: infrastructure/helm/values.prod.yaml

jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency: ${{ github.ref }}-build
    permissions:
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build and push images
        uses: noi-techpark/github-actions/docker-build-and-push@v2
        with:
          working-directory: infrastructure
          docker-username: ${{ github.actor }}
          docker-password: ${{ secrets.GITHUB_TOKEN }}

  deploy-test:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    concurrency: deploy-test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set image tag
        run: yq -i '.image.tag = "${{ env.DOCKER_TAG }}"' ${{ env.VALUES_YAML_TEST }}

      - name: Deploy on cluster
        uses: noi-techpark/github-actions/helm-deploy@v2
        with:
          k8s-name: ${{ env.K8S_NAME }}
          k8s-namespace: ${{ env.KUBERNETES_NAMESPACE }}
          chart-path: infrastructure/helm/template
          values-file: ${{ env.VALUES_YAML_TEST }}
          aws-access-key-id: ${{ secrets.AWS_DEV_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEV_ACCESS_KEY_SECRET }}
          aws-eks-cluster-name: aws-main-eu-01
          aws-region: eu-west-1

  deploy-prod:
    if: github.ref == 'refs/heads/prod'
    needs: build
    runs-on: ubuntu-24.04
    concurrency: deploy-prod
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set image tag
        run: yq -i '.image.tag = "${{ env.DOCKER_TAG }}"' ${{ env.VALUES_YAML_PROD }}

      - name: Deploy on cluster
        uses: noi-techpark/github-actions/helm-deploy@v2
        with:
          k8s-name: ${{ env.K8S_NAME }}
          k8s-namespace: ${{ env.KUBERNETES_NAMESPACE }}
          chart-path: infrastructure/helm/template
          values-file: ${{ env.VALUES_YAML_PROD }}
          aws-access-key-id: ${{ secrets.AWS_PROD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_PROD_ACCESS_KEY_SECRET }}
          aws-eks-cluster-name: aws-main-eu-01
          aws-region: eu-west-1
